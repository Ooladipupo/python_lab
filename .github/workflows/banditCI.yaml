name: Bandit

on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]

permissions: 
  security-events: write
  contents: read
  
jobs:
  bandit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: |
          pip install bandit[json]
          
      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit-result.json --exit-zero

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-result.json
